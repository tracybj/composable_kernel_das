<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img">
<title>BF16 NN Decode：A寄存器、B私有LDS流水</title>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style>
<rect width="1800" height="1040" fill="white"/>
<rect x="0" y="0" width="1800" height="112" rx="0" fill="#B5122B" stroke="none" stroke-width="2"/>
<text x="48" y="68" font-size="44" fill="#FFFFFF" font-weight="600">BF16 NN Decode：A寄存器、B私有LDS流水</text>
<text x="48" y="159" font-size="25" fill="#54677B" font-weight="400">示例：16×128输出块，4个wave沿N划分；K16分块、双缓冲</text>
<rect x="48" y="195" width="1704" height="48" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="65" y="229" font-size="28" fill="#17324D" font-weight="600">阶段一  主循环：wave独立搬运与计算</text>
<text x="48" y="293.0" font-size="28" fill="#17324D" font-weight="400">A直接进入寄存器；B进入本wave私有LDS。双缓冲交替推进，不使用CTA barrier。</text>
<rect x="48" y="326" width="250" height="136" rx="10" fill="#FFF2D5" stroke="none" stroke-width="2"/>
<text x="122.8203125" y="363.0" font-size="26" fill="#17324D" font-weight="600">Global A</text>
<text x="130.828125" y="399.18" font-size="26" fill="#17324D" font-weight="400">A[M, K]</text>
<text x="83.5390625" y="435.36" font-size="26" fill="#17324D" font-weight="400">Direct-to-VGPR</text>
<rect x="340" y="326" width="410" height="136" rx="10" fill="#EAF2FC" stroke="none" stroke-width="2"/>
<text x="440.265625" y="364.0" font-size="26" fill="#17324D" font-weight="600">A寄存器 · 双缓冲</text>
<text x="503.828125" y="399.18" font-size="26" fill="#17324D" font-weight="400">A0 / A1</text>
<text x="416.828125" y="438.36" font-size="26" fill="#17324D" font-weight="400">直接作为MMAC操作数</text>
<polyline points="304,394 334,394" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="334,394 322.0,389.0 322.0,399.0" fill="#54677B"/>
<polyline points="756,394 1198,394" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="1198,394 1186.0,389.0 1186.0,399.0" fill="#54677B"/>
<rect x="48" y="480" width="250" height="136" rx="10" fill="#FFF2D5" stroke="none" stroke-width="2"/>
<text x="122.1875" y="517.0" font-size="26" fill="#17324D" font-weight="600">Global B</text>
<text x="131.3515625" y="553.18" font-size="26" fill="#17324D" font-weight="400">B[K, N]</text>
<text x="92.28125" y="589.36" font-size="26" fill="#17324D" font-weight="400">Direct-to-LDS</text>
<rect x="340" y="480" width="410" height="136" rx="14" fill="#FBEAEE" stroke="none" stroke-width="2"/>
<text x="425.28125" y="523.0" font-size="29" fill="#17324D" font-weight="600">本wave私有B-LDS</text>
<rect x="364" y="552" width="172" height="44" rx="6" fill="#FFFFFF" stroke="#B9C8D6" stroke-width="2"/>
<text x="428.65625" y="583.0" font-size="24" fill="#17324D" font-weight="400">槽 0</text>
<rect x="554" y="552" width="172" height="44" rx="6" fill="#FFFFFF" stroke="#B9C8D6" stroke-width="2"/>
<text x="618.65625" y="583.0" font-size="24" fill="#17324D" font-weight="400">槽 1</text>
<rect x="795" y="480" width="350" height="136" rx="10" fill="#EAF2FC" stroke="none" stroke-width="2"/>
<text x="883.4609375" y="518.0" font-size="26" fill="#17324D" font-weight="600">B操作数寄存器</text>
<text x="868.2421875" y="555.18" font-size="26" fill="#17324D" font-weight="400">从当前LDS槽读取</text>
<text x="854.828125" y="592.36" font-size="26" fill="#17324D" font-weight="400">就绪后供MMAC使用</text>
<polyline points="304,548 334,548" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="334,548 322.0,543.0 322.0,553.0" fill="#54677B"/>
<polyline points="756,548 789,548" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="789,548 777.0,543.0 777.0,553.0" fill="#54677B"/>
<polyline points="1151,548 1198,548" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="1198,548 1186.0,543.0 1186.0,553.0" fill="#54677B"/>
<rect x="1204" y="326" width="548" height="290" rx="14" fill="#7051A4" stroke="none" stroke-width="2"/>
<text x="1316.4140625" y="381.0" font-size="34" fill="#FFFFFF" font-weight="600">MMAC：计算当前K块</text>
<text x="1375.5546875" y="453.0" font-size="29" fill="#FFFFFF" font-weight="400">A(reg) × B(reg)</text>
<text x="1284.296875" y="496.47" font-size="29" fill="#FFFFFF" font-weight="400">FP32累加到当前wave的C子块</text>
<text x="1381.6328125" y="537.94" font-size="29" fill="#FFFFFF" font-weight="400">独立累加完整K</text>
<rect x="48" y="650" width="399" height="47" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="108.328125" y="684.0" font-size="25" fill="#17324D" font-weight="400">Wave 0 → C0（16×32）</text>
<rect x="483" y="650" width="399" height="47" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="543.328125" y="684.0" font-size="25" fill="#17324D" font-weight="400">Wave 1 → C1（16×32）</text>
<rect x="918" y="650" width="399" height="47" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="978.328125" y="684.0" font-size="25" fill="#17324D" font-weight="400">Wave 2 → C2（16×32）</text>
<rect x="1353" y="650" width="399" height="47" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="1413.328125" y="684.0" font-size="25" fill="#17324D" font-weight="400">Wave 3 → C3（16×32）</text>
<text x="48" y="743.0" font-size="26" fill="#54677B" font-weight="400">各wave负责不同N列，独立预取、等待和计算；只需保证本wave的数据就绪与槽复用安全。</text>
<rect x="48" y="785" width="1704" height="48" rx="5" fill="#F2F5F9" stroke="none" stroke-width="2"/>
<text x="65" y="819" font-size="28" fill="#17324D" font-weight="600">阶段二  K收尾与写回：复用私有LDS排列输出</text>
<rect x="48" y="866" width="280" height="100" rx="10" fill="#7051A4" stroke="none" stroke-width="2"/>
<text x="93.5" y="905.0" font-size="27" fill="#FFFFFF" font-weight="400">消化已预取数据</text>
<text x="111.78125" y="943.61" font-size="27" fill="#FFFFFF" font-weight="400">完成剩余K块</text>
<rect x="365" y="866" width="330" height="100" rx="10" fill="#EAF2FC" stroke="none" stroke-width="2"/>
<text x="448.1640625" y="901.0" font-size="27" fill="#17324D" font-weight="400">FP32 → BF16</text>
<text x="476.0" y="943.61" font-size="27" fill="#17324D" font-weight="400">舍入转换</text>
<rect x="732" y="866" width="280" height="100" rx="10" fill="#FBEAEE" stroke="none" stroke-width="2"/>
<text x="793.3359375" y="905.0" font-size="27" fill="#17324D" font-weight="400">写入私有LDS</text>
<text x="777.5" y="943.61" font-size="27" fill="#17324D" font-weight="400">排列输出＋等待</text>
<rect x="1049" y="866" width="330" height="100" rx="10" fill="#EAF2FC" stroke="none" stroke-width="2"/>
<text x="1136.1484375" y="905.0" font-size="27" fill="#17324D" font-weight="400">读回16B向量</text>
<text x="1108.3359375" y="943.61" font-size="27" fill="#17324D" font-weight="400">等待LDS数据就绪</text>
<rect x="1416" y="866" width="336" height="100" rx="10" fill="#E6F3EE" stroke="none" stroke-width="2"/>
<text x="1539.0625" y="901.0" font-size="27" fill="#17324D" font-weight="400">Store C</text>
<text x="1492.0390625" y="943.61" font-size="27" fill="#17324D" font-weight="400">按有效M行写回</text>
<polyline points="332,916 361,916" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="361,916 349.0,911.0 349.0,921.0" fill="#54677B"/>
<polyline points="699,916 728,916" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="728,916 716.0,911.0 716.0,921.0" fill="#54677B"/>
<polyline points="1016,916 1045,916" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="1045,916 1033.0,911.0 1033.0,921.0" fill="#54677B"/>
<polyline points="1383,916 1412,916" fill="none" stroke="#54677B" stroke-width="3"/><polygon points="1412,916 1400.0,911.0 1400.0,921.0" fill="#54677B"/>
<text x="48" y="1016.0" font-size="25" fill="#17324D" font-weight="400">每个C元素已在所属wave内累加完整K；尾部只排列写回，无跨wave归约，也无需CTA barrier。</text>
</svg>