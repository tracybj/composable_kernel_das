<title>P6f Decode：几何、尾段与采用状态</title>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style>
<rect width="1800" height="1570" fill="white"/>
<rect x="0" y="0" width="1800" height="112" rx="0" fill="#B5122B" stroke="none" stroke-width="2"/>
<text x="48" y="68" font-size="44" fill="#FFFFFF" font-weight="600">P6f Decode：几何、尾段与采用状态</text>
<text x="48" y="159" font-size="25" fill="#54677B" font-weight="400">同一共享LDS协作骨架下的不同实现｜实例ID与实际K stage分开看｜不以文件数量定义独立架构</text>
