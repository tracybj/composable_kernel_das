<text x="65" y="229" font-size="28" fill="#17324D" font-weight="600">阶段一  主循环：CTA协作搬运，分组交错计算</text>
<text x="48" y="293.0" font-size="28" fill="#17324D" font-weight="400">A、B共同进入四槽共享LDS，再读入三组操作数寄存器；每个stage同步后安全复用共享槽。</text>
