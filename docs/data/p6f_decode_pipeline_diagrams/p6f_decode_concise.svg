<text x="48" y="69" font-size="44" fill="#FFFFFF" font-weight="600">BF16 NN Decode：共享LDS协作流水（P6f）</text>
<text x="48" y="159" font-size="25" fill="#54677B" font-weight="400">以小M K16 / K32为例：wave按M/N负责不同输出块，各自累加完整K</text>
